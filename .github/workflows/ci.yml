name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, fmt, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/relay ./cmd/relay

      - name: smoke test binary
        run: |
          ./bin/relay version
          ./bin/relay serve --db :memory: --addr 127.0.0.1:18080 --log-format json &
          PID=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 0.5
          done
          curl -fsS -X POST http://127.0.0.1:18080/jobs -d '{"type":"noop"}'
          sleep 1
          curl -fsS http://127.0.0.1:18080/queues
          curl -fsS http://127.0.0.1:18080/metrics | grep jobs_succeeded_total
          kill -INT $PID
          wait $PID

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: relay:ci
